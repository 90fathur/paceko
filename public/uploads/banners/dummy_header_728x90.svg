<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 728 90" width="728" height="90">
  <defs>
    <linearGradient id="bankGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a2540" />
      <stop offset="50%" stop-color="#144272" />
      <stop offset="100%" stop-color="#205295" />
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#fbbf24" />
    </linearGradient>
  </defs>
  <!-- Background -->
  <rect width="728" height="90" rx="8" fill="url(#bankGrad)"/>
  <rect x="0.5" y="0.5" width="727" height="89" rx="7.5" fill="none" stroke="#2c5e9e" stroke-width="1"/>
  
  <!-- Left Logo & Badge -->
  <rect x="16" y="16" width="58" height="58" rx="8" fill="#ffffff" fill-opacity="0.12"/>
  <circle cx="45" cy="45" r="20" fill="url(#goldGrad)"/>
  <path d="M45 32 L53 38 L37 38 Z M39 41 L41 41 L41 53 L39 53 Z M44 41 L46 41 L46 53 L44 53 Z M49 41 L51 41 L51 53 L49 53 Z M36 54 L54 54 L54 56 L36 56 Z" fill="#0a2540"/>
  
  <!-- Typography -->
  <text x="86" y="34" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="16" font-weight="800" fill="#ffffff" letter-spacing="0.5">BANK SULBAR</text>
  <rect x="206" y="21" width="85" height="17" rx="3" fill="url(#goldGrad)"/>
  <text x="212" y="33" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="9" font-weight="700" fill="#0a2540">MITRA RESMI</text>
  
  <text x="86" y="54" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="500" fill="#93c5fd">Bank Pembangunan Daerah Kebanggaan Masyarakat Sulawesi Barat</text>
  <text x="86" y="72" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10.5" font-weight="400" fill="#cbd5e1">Tabungan Masa Depan, KUR Berbunga Ringan &amp; Layanan Mobile Banking Terpadu</text>
  
  <!-- CTA Button -->
  <rect x="580" y="26" width="132" height="38" rx="19" fill="url(#goldGrad)"/>
  <text x="646" y="50" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11.5" font-weight="800" fill="#0a2540" text-anchor="middle">BUKA REKENING</text>
  
  <!-- Dimension Pill -->
  <rect x="635" y="68" width="77" height="14" rx="3" fill="#000000" fill-opacity="0.4"/>
  <text x="673" y="78.5" font-family="monospace" font-size="8" font-weight="600" fill="#ffffff" text-anchor="middle">728 x 90 px</text>
</svg>
