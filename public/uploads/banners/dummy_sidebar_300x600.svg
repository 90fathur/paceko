  <text x="150" y="148" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="700" fill="url(#univGold)" text-anchor="middle">KAMPUS NEGERI MAJU &amp; BERKUALITAS</text>
  
