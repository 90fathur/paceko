      <stop offset="100%" stop-color="#172554" />
    </linearGradient>
    <linearGradient id="univGold" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#eab308" />
      <stop offset="100%" stop-color="#facc15" />
