  <rect width="300" height="600" rx="12" fill="url(#univGrad)"/>
  <rect x="1" y="1" width="298" height="598" rx="11" fill="none" stroke="#3b82f6" stroke-width="1.5" stroke-opacity="0.4"/>
  
